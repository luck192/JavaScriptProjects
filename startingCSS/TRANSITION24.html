<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition</title>
    <style>
     .box{
        margin: 25px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 30px;
        font-weight: bold;
        height:400px;
        width:400px;
        background-color: beige;
        border: 2px solid black;

        transition-property: all;
        transition-duration: 2s;
        transition-timing-function: linear;
        transition-delay: 1s;
        box-shadow: 20px 20px 20px;

    }
    /*hiver krne p kya hona chaiye */
    .box:hover{
        width: 800px;
        background-color: aqua;
        height: 800px;
        
    }

    </style>
</head>
<body>
    <div class="box">
      HOVER TO SEE 
    </div>
</body>
</html>
