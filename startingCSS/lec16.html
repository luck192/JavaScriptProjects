<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin-bottom:10px;
            padding:0;
        }
        .box{
            border:2px solid red;
            box-sizing: border-box;
            width: 300px;
            height: 300px;
            padding:80px;

        }
        span{
            border : 3px solid green;
            display: inline-block;
            margin-right: 20px;;
            width:30px;
            padding-left:10px;

        }
        #k{
             border : 3px solid red;
             height:100px;
        }

    </style>
</head>
<body>
    <!-- INLINE, BOX_SIZE -->
   
    <span>1</span>
    <span id="k">21</span>
    <span id="p">1</span>
   
</body>
</html>
