<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            padding-left: 10px;
        }
      .container{
         background-color: rgb(17, 227, 227);
         height: 1120px;
         border: 2px solid black;
    }
    .box{
        width:100px;
        height:20px;
        border: 2px solid black;
        border-radius: 20px;
        background-color:rgb(255, 228, 196);
        /* xab->identifier just ek tag derhe h */
        /* animation-fill-mode:forwards; */
      }
      #box1{
        animation-name:upBlock;
        animation-direction: alternate;
        position: relative;
        animation-duration: 4s;
        animation-iteration-count: infinite;
        animation-delay: 1s;
        animation-timing-function: linear;
        margin:5px;
      }
       @keyframes upBlock {
        from{
            top:0;
            left:0;
        }
        to{
            top:0;
            left: 900px;
        }
    }
      #box2{
        animation-name:downBlock;
        animation-direction: alternate-reverse;
        position: relative;
        animation-duration: 8s;
        animation-iteration-count: infinite;
        animation-delay: 1s;
        animation-timing-function: linear;
        margin:5px;
        /* transition: transform 8s ease-in-out; */
      }
      /* #box2:hover{
        transform: translate(1800px,0px);
      } */
       @keyframes downBlock {
        from{
            top: 910px;
            left:0;
        }
        to{
            top:910px;
            left: 900px;
        }
        
    }
    #ball1{
      box-sizing: border-box;
      padding: 11px;
      width:50px;
      height:50px;
      border: 2px solid black;
      background-color: yellow;
      border-radius:60px;
      position: relative;
      left:500px;
      top:500px;
      /* animations */
      animation: ballMovement 20s linear 1s infinite alternate none;
      animation: name duration timing-function delay iteration-count direction fill-mode;
      animation-play-state: running;
    }
    @keyframes ballMovement {
        0%{
            left:500px;
            top:500px;
        }
        20%{
            top:5px;
            left:980px;
        }
        40%{
            top:930px;
            left:0px;
        }
        60%{
            top:415px;
            left:1020px;
        }
        80%{
            top:0px;
            left:0px;
        }
        100%{
            top: 940px;
            left:430px;
        }
    }
      
   
    </style>

</head>
<body>
    <div class="container">
        <h1>PING BALL GAME</h1>
        <div class="box" id="box1"></div>
        <div  id="ball1">ball</div>
        <div class="box" id="box2" ></div>
    </div>
</body>
</html>
